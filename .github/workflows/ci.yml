name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  etl:
    name: ETL (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: istanbul_traffic
          POSTGRES_USER: traffic_admin
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traffic_admin -d istanbul_traffic"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Integration tests create and drop their own temporary databases on this server.
      DATABASE_URL: postgresql://traffic_admin:ci-password@127.0.0.1:5432/istanbul_traffic
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/pyproject.toml
      - name: Install
        run: pip install -e "./etl[dev]"
      - name: Test
        run: python -m pytest etl

  backend:
    name: Backend (build and xUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore IstanbulTraffic.slnx
      - name: Build
        run: dotnet build IstanbulTraffic.slnx --configuration Release --no-restore
      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - name: Test
        run: dotnet test --solution IstanbulTraffic.slnx --configuration Release --no-build

  frontend:
    name: Frontend (lint, types, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Pages are rendered on request, so the build does not need a running API.
      - run: npm run build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [etl, backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: API image
        run: docker build --tag istanbul-traffic-api backend
      - name: Dashboard image
        run: docker build --tag istanbul-traffic-web frontend
      - name: ETL image
        run: docker build --tag istanbul-traffic-etl --file etl/Dockerfile .
