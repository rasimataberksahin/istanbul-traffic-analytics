[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-etl"
version = "0.2.0"
description = "ETL pipeline for the Istanbul hourly traffic density data set"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26,<3",
    "pandas==2.2.2",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
eda = ["ipykernel==7.4.0", "matplotlib==3.11.2", "nbconvert==7.17.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs a running PostgreSQL server"]
