name: istanbul-traffic

# Database, API and dashboard:
#   docker compose up -d --build
# Load months into the database (downloads, cleans and loads):
#   docker compose --profile etl run --rm etl --from 2024-10 --to 2024-12

x-database-env: &database-env
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment: *database-env
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
    shm_size: 1gb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55442}:5432"
    volumes:
      - traffic_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Traffic: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Admin__ApiKey: ${Admin__ApiKey:?Set Admin__ApiKey in .env}
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "127.0.0.1:${API_PORT:-5088}:8080"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    profiles: ["etl"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./data:/app/data
      - ./docs/etl-runs:/app/docs/etl-runs

volumes:
  traffic_pgdata:
